<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校園導覽系統</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f5f7fa;
        }

        header {
            background-color: #234f36;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        main {
            padding: 25px;
        }

        section {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        footer {
            background-color: #234f36;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <!-- 網頁標題 -->
    <header>
        <h1>校園導覽系統</h1>
        <p>探索校園，認識我們的學校</p>
    </header>

    <!-- 導覽列 -->
    <nav>
        <a href="#home">首頁</a>
        <a href="#map">校園地圖</a>
        <a href="#buildings">校園景點</a>
        <a href="#about">關於我們</a>
    </nav>

    <!-- 網頁主要內容 -->
    <main>

        <!-- 首頁介紹 -->
        <section id="home">
            <h2>歡迎來到校園導覽</h2>
            <p>透過本網站，快速認識校園環境與各項設施。</p>
        </section>

        <!-- 校園地圖 -->
        <section id="map">
            <h2>校園地圖</h2>
            <p>這裡可以放置校園地圖圖片或互動式地圖。</p>
            <img src="scu.jpg" width="700">
        </section>

        <!-- 校園景點 -->
        <section id="buildings">
            <h2>校園景點介紹</h2>

            <article>
                <h3>圖書館</h3>
                <p>提供學生閱讀、自習及查詢資料的空間。</p>
            </article>

            <article>
                <h3>教學大樓</h3>
                <p>主要提供課程教學與學習活動。</p>
            </article>

            <article>
                <h3>學生餐廳</h3>
                <p>提供學生用餐與休息的場所。</p>
            </article>
        </section>

        <!-- 關於我們 -->
        <section id="about">
            <h2>關於我們</h2>
            <p>此網站為校園導覽系統，協助大家快速了解校園。</p>
        </section>

    </main>

    <!-- 頁尾 -->
    <footer>
        <p>&copy; 2026 校園導覽系統</p>
    </footer>
